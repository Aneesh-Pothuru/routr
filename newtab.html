<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12vh;
    }

    /* ─── Search ─── */
    .search-container {
      width: 100%;
      max-width: 620px;
      margin-bottom: 40px;
    }
    .brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand h1 {
      font-size: 42px;
      font-weight: 800;
      background: linear-gradient(135deg, #58a6ff 0%, #a371f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand p {
      font-size: 13px;
      color: #484f58;
      margin-top: 4px;
    }
    #newtab-search {
      width: 100%;
      padding: 16px 24px;
      font-size: 16px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      color: #e1e4e8;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #newtab-search::placeholder { color: #484f58; }
    #newtab-search:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }
    .search-results {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      margin-top: 6px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    .search-results.visible { display: block; }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .search-result-item:hover, .search-result-item.selected { background: #1c2030; }
    .search-result-key {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      font-weight: 600;
      color: #79c0ff;
      background: #0d1117;
      padding: 4px 10px;
      border-radius: 6px;
      min-width: 40px;
      text-align: center;
    }
    .search-result-key.group-key { color: #f0b860; background: #2a1f0f; }
    .search-result-desc { font-size: 14px; color: #c9d1d9; flex: 1; }
    .search-result-meta { font-size: 11px; color: #484f58; }

    /* ─── Content ─── */
    .content { width: 100%; max-width: 820px; }

    /* ─── Groups ─── */
    .groups-row {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .group-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e1e4e8;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 14px;
    }
    .group-btn:hover {
      border-color: #f0b860;
      background: #1c2030;
    }
    .group-btn-key {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      color: #f0b860;
      font-weight: 600;
    }
    .group-btn-count {
      font-size: 11px;
      color: #484f58;
    }

    /* ─── Time-Aware Section ─── */
    .time-section {
      margin-bottom: 32px;
    }
    .time-label {
      font-size: 12px;
      font-weight: 600;
      color: #484f58;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    /* ─── Tiles ─── */
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 20px 12px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .tile:hover {
      border-color: #58a6ff;
      background: #1c2030;
      transform: translateY(-2px);
    }
    .tile-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #58a6ff;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .tile-name {
      font-size: 12px;
      color: #c9d1d9;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }
    .tile-key {
      font-size: 10px;
      color: #484f58;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* ─── Footer ─── */
    .footer {
      position: fixed;
      bottom: 16px;
      right: 20px;
      font-size: 11px;
      color: #30363d;
    }
    .footer a { color: #484f58; text-decoration: none; cursor: pointer; }
    .footer a:hover { color: #58a6ff; }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="search-container">
    <div class="brand">
      <h1>Routr</h1>
      <p id="greeting"></p>
    </div>
    <input type="text" id="newtab-search" placeholder="Type a shortcut (e.g. gh/routr) or search..." autofocus>
    <div class="search-results" id="search-results"></div>
  </div>

  <div class="content">
    <div class="groups-row" id="groups-row"></div>
    <div class="time-section" id="time-section">
      <div class="time-label" id="time-label"></div>
      <div class="tiles" id="time-tiles"></div>
    </div>
    <div class="time-section">
      <div class="time-label">Top Shortcuts</div>
      <div class="tiles" id="top-tiles"></div>
    </div>
  </div>

  <div class="footer">
    <a id="open-settings">Settings</a>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
