<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Routr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      max-height: 460px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
    }
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #30363d;
    }
    .popup-header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #58a6ff;
    }
    .popup-header a {
      font-size: 12px;
      color: #8b949e;
      cursor: pointer;
      text-decoration: none;
    }
    .popup-header a:hover { color: #58a6ff; }
    #popup-search {
      width: 100%;
      padding: 10px 16px;
      background: #161b22;
      border: none;
      border-bottom: 1px solid #30363d;
      color: #e1e4e8;
      font-size: 13px;
      outline: none;
    }
    #popup-search::placeholder { color: #484f58; }
    #popup-search:focus { background: #1c2030; }
    #popup-list {
      max-height: 360px;
      overflow-y: auto;
    }
    .popup-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .popup-item:hover, .popup-item.selected { background: #1c2030; }
    .popup-item.selected { outline: 1px solid #58a6ff; }
    .popup-key {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 600;
      color: #79c0ff;
      background: #0d1117;
      padding: 3px 8px;
      border-radius: 4px;
      min-width: 40px;
      text-align: center;
    }
    .popup-desc {
      font-size: 13px;
      color: #c9d1d9;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .popup-url {
      font-size: 11px;
      color: #484f58;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .popup-group-item { background: #161b22; }
    .popup-group-key { background: #2a1f0f !important; color: #f0b860 !important; }
    .popup-group-count {
      font-size: 10px;
      color: #8b949e;
      white-space: nowrap;
    }
    .popup-template {
      font-size: 9px;
      color: #a371f7;
      background: #2a1f3f;
      padding: 1px 4px;
      border-radius: 3px;
      margin-left: 3px;
      vertical-align: middle;
    }
    .popup-section-label {
      padding: 6px 16px 4px;
      font-size: 10px;
      font-weight: 600;
      color: #484f58;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .popup-empty {
      text-align: center;
      padding: 24px;
      color: #484f58;
      font-size: 13px;
    }
    #popup-list::-webkit-scrollbar { width: 6px; }
    #popup-list::-webkit-scrollbar-track { background: transparent; }
    #popup-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    .close-dupes-btn {
      width: calc(100% - 24px);
      margin: 8px 12px;
      padding: 8px;
      background: #1c2030;
      border: 1px solid #f85149;
      border-radius: 8px;
      color: #f85149;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .close-dupes-btn:hover { background: #f8514922; }

    /* Favicons */
    .popup-favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* Sessions */
    .popup-sessions {
      border-top: 1px solid #30363d;
      padding: 8px 0;
    }
    .save-session-btn {
      width: calc(100% - 24px);
      margin: 4px 12px;
      padding: 8px;
      background: #1c2030;
      border: 1px solid #a371f7;
      border-radius: 8px;
      color: #a371f7;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .save-session-btn:hover { background: #a371f722; }
    .session-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      cursor: pointer;
      transition: background 0.1s;
      font-size: 12px;
    }
    .session-item:hover { background: #1c2030; }
    .session-name { color: #c9d1d9; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-meta { color: #484f58; font-size: 10px; white-space: nowrap; }
    .session-restore-btn {
      padding: 2px 8px;
      border: 1px solid #238636;
      background: transparent;
      border-radius: 4px;
      color: #238636;
      font-size: 10px;
      cursor: pointer;
      font-weight: 500;
    }
    .session-restore-btn:hover { background: #23863622; }
  </style>
</head>
<body>
  <div class="popup-header">
    <h1>Routr</h1>
    <a id="open-options">Settings</a>
  </div>
  <input type="text" id="popup-search" placeholder="Search shortcuts..." autofocus>
  <div id="popup-list"></div>
  <button id="close-dupes" class="close-dupes-btn" style="display:none;">Close duplicates</button>
  <div class="popup-sessions">
    <div class="popup-section-label">Sessions</div>
    <button id="save-session" class="save-session-btn">Save open tabs as session</button>
    <div id="sessions-list"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
